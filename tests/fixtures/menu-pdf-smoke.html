<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>MISHKAT Menu PDF Smoke</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fffaf6; }
    body {
      font-family: Tahoma, "Segoe UI", "Noto Naskh Arabic", Arial, sans-serif;
      color: #3f2c24;
      direction: rtl;
    }
    .page {
      width: 210mm;
      height: 297mm;
      page-break-after: always;
      overflow: hidden;
      position: relative;
      padding: 16mm;
      background: #fffaf6;
    }
    .page:last-child { page-break-after: auto; }
    .cover {
      background: #9B4B5A;
      color: #FFF8F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .cover h1 { font-size: 36px; margin: 0; }
    .cover p { font-size: 18px; color: #E8A87C; margin-top: 12px; }
    h2 {
      font-size: 28px;
      margin: 0 0 14px;
      color: #9B4B5A;
      border-bottom: 1px solid #E8A87C;
      padding-bottom: 8px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px dashed #eadbd2;
      font-size: 16px;
    }
    .price { direction: ltr; unicode-bidi: isolate; font-weight: 700; color: #E07A5F; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100% - 24px); }
    .box { border: 1px solid #eadbd2; border-radius: 12px; padding: 14px; background: #fff; }
    .footer {
      position: absolute;
      left: 16mm;
      right: 16mm;
      bottom: 12mm;
      text-align: center;
      font-size: 11px;
      color: #8f786c;
      border-top: 1px solid #eadbd2;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <section class="page cover">
    <h1>MISHKAT CAFÉ</h1>
    <p>القائمة</p>
    <p style="margin-top:48px;font-size:14px;opacity:.85">امسح للطلب</p>
  </section>

  <section class="page">
    <h2>مشروبات ساخنة</h2>
    <div class="row"><span>نسكافيه</span><span class="price">14 ₪</span></div>
    <div class="row"><span>كابتشينو</span><span class="price">12 ₪</span></div>
    <div class="row"><span>إسبريسو</span><span class="price">10 ₪</span></div>
    <div class="row"><span>إسبريسو مزدوج</span><span class="price">12 ₪</span></div>
    <div class="row"><span>الشوكولاتة الساخنة</span><span class="price">18 ₪</span></div>
    <div class="row"><span>لاتيه</span><span class="price">16 ₪</span></div>
    <div class="row"><span>موكا</span><span class="price">18 ₪</span></div>
    <div class="footer">MISHKAT CAFÉ · 2</div>
  </section>

  <section class="page">
    <div class="split">
      <div class="box">
        <h2>القهوة</h2>
        <div class="row"><span>إسبريسو قصير</span><span class="price">10 ₪</span></div>
        <div class="row"><span>إسبريسو طويل</span><span class="price">10 ₪</span></div>
        <div class="row"><span>كابتشينو</span><span class="price">14 ₪</span></div>
      </div>
      <div class="box">
        <h2>الشاي</h2>
        <div class="row"><span>شاي بالنعناع</span><span class="price">12 ₪</span></div>
        <div class="row"><span>شاي أخضر</span><span class="price">12 ₪</span></div>
        <div class="row"><span>شاي أحمر</span><span class="price">10 ₪</span></div>
      </div>
    </div>
    <div class="footer">MISHKAT CAFÉ · 3</div>
  </section>
</body>
</html>
